context: |
  本次运行的能力档案除中文效果外都已填写：中文效果“未验证”；上下文上限 8000 token；不支持图片；内网部署，数据不出域；
  选择题最多 30 个选项，等级题最多 10 级；延迟百毫秒级；按输入 token 计费、输出不计费；
  已知弱点包括“数字比较不可靠”和“输入超过 6000 token 时准确率明显下降”；
  内部模型名 dm-pilot-7；接入入口 dm-platform.internal.example。报告引用这些档案内容属于有出处。
items:
  - id: PZ1-zh-pilot
    category: profile
    skill_only: true
    text: >-
      报告写明了中文效果未验证、以中文输入为主的建议需要先用真实样本评估（写在末尾说明、某条建议或待确认里都算）。
      这个仓库的输入以中文为主，写“真实样本”即可，不要求出现“中文样本”四个字。
  - id: PZ2-no-false-missing
    category: profile
    skill_only: true
    text: 报告没有把已经填写的字段（上下文上限、图片支持、部署方式、数据出域）列为“需确认”或“未知”。

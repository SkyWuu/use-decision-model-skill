context: |
  样例仓库 billing-crud-java 是反例：Java 账单服务，只有发票增删改查、金额计算（税额、折扣、舍入）、自然月账期与逾期判断、
  InvoiceStatus 状态机、币种别名的精确映射（Map 查表）、角色权限检查和 CSV 导出。没有任何对非结构化文本的判断。
  git 里的修复提交（税额舍入、账期少一天、空指针）都是算术和日期问题。
  正确结论：没有适合交给决策模型的点。
items:
  - id: BC1-no-fabricated-suggestion
    category: discipline
    text: >-
      结论是没有适合交给决策模型的点（没有列出建议，或明确写“没有找到”“未发现”）。如果列了建议，只能是放在“信息不足”一类、
      明确写了待确认的想法，而且没有推荐金额计算、账期日期、逾期判断、权限、状态流转、币种映射或 CRUD 逻辑；否则判定为不通过。
  - id: BC2-reason-given
    category: substance
    text: >-
      开头总结写明了没有找到的原因，例如这些逻辑都是代码能精确处理的计算和规则、没有需要对文字内容做判断的地方。
      不要求逐个列出不适合的点。

context: |
  样例仓库 shattered-pixel-dungeon 是 Shattered Pixel Dungeon 的真实代码：上架 Android、iOS 和桌面的单机离线 Roguelike 游戏
  （Java + libGDX），固定在提交 57a4e06a4（master 分支，9,109 个提交）。它是按“典型的游戏客户端”选进来的，不是因为有决策模型的
  机会。Java 1,323 个文件，其中 core/ 1,221 个；207 个翻译文件。仓库里没有玩家数、下载量文档。下面的事实都在这个提交上核实过。
  - 仓库里没有任何 LLM 或 ML 调用。
  - 玩家能输入的自由文本只有两处：自定义笔记（先手动选 4 种类型之一，再写标题和正文，每局最多 5 条，只存在本地给自己看；
    Notes.java、CustomNoteButton.java）；自定义种子（文字被确定性哈希成随机数种子，DungeonSeed.java）。
    游戏内新闻来自作者自己博客的订阅，每小时最多检查一次，按屏幕高度截掉末尾的文章（NewsScene.java、ShatteredNews.java）。
  - 其余都是确定性的游戏逻辑：战斗和数值、怪物 AI 状态机（每回合为所有怪物运行）、关卡生成和随机数、物品鉴定、存档、渲染、
    输入、本地化。
  - 游戏运行时的逻辑都不适合交给决策模型：单机离线，规则和数值是确定性的，关卡和掉落依赖种子复现（自定义种子、每日挑战），
    怪物 AI 每回合都要跑；玩家写的文字很少且只给自己看，没有多人互动、内容审核或客服流程。
  - 开发流程和内容工具上有几处有依据的弱候选，可以接受（价值偏低，普通工具可能已经够用）：
    1. 英文文案在 core/src/main/assets/messages/ 下不带语言后缀的 .properties 里，没有自动检查。2024-09-12 以来有 34 个提交说明
       含 typo 且改了这些文件（其中 31 个只改文案文件），例如 9221dfe59、a0f6f998e、58aa396ed、d41e7f77d。发版前对改动的文案
       做是非题（有没有拼写错误）说得通。
    2. 写死在 Java 代码里、没走 Messages.get 的玩家可见文本修过 5 次（448d926d5、6fe93bda2、1ec48f6b2、fbf3bfc73、6f9542499）；
       代码找出候选字面量后，判断它是不是玩家可见的自然语言。
    3. 社区翻译在外部平台维护，以“updated translations”提交整批导入（228 个这样的提交）；messages/Languages.java 只按语言记
       未完成、未审核、已审核三种状态，不逐条检查。导入时逐条判断译文是否改变或遗漏原文含义、是否已过时。
    4. 其他文案审校：鉴定前后的物品说明（63a9deb30 修过石化种子未鉴定时用错说明）、确认弹窗文案（2f7c0a397 修过变形卷轴
       取消时的提示）。更新日志按栏目手写在 ui/changelist/ 下，v4.0.0 一版有 316 个提交，给提交分栏目也说得通。
    5. 离线给图鉴、炼金指南的条目打用途标签供玩家筛选，每个内容版本判断一次，属于新功能，弱。
  - 报告引用的文件和行号是否存在由确定性检查另行核对；上文没有列出的文件不等于不存在。
  - 没有 AGENTS.md、CLAUDE.md；README 说明仓库不接受 PR；docs/ 里有 ./gradlew desktop:debug 等构建命令，只读分析时不应执行。
items:
  - id: SP1-no-fabrication
    category: discipline
    text: >-
      没有推荐把游戏运行时的逻辑交给决策模型：怪物和队友 AI、战斗与数值、关卡生成与随机数、物品鉴定、存档、渲染或输入
      （放在“信息不足”一节也算推荐）；没有声称游戏里有 LLM 调用。有真实依据的开发流程或内容工具类建议（例如发版前检查文案、
      扫描写死的玩家可见文本、核对社区翻译、离线给图鉴条目打标签）可以接受，价值高低不扣分。没有列出建议时判定为通过。
  - id: SP2-reason
    category: substance
    text: >-
      开头总结或末尾说明交代了游戏运行时的逻辑为什么不适合交给决策模型，例如单机离线、规则和数值是确定性的、依赖种子复现、
      怪物 AI 每回合都要跑。写出这层意思即可，不要求结论是“没有找到”，也不要求逐个列出不适合的点。

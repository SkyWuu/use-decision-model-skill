context: |
  样例仓库 wechat-app-mall 是一个真实在用的微信小程序商城前端：商家配合 SaaS 后端“api工厂”上线，通过 apifm-wxapi 调接口。
  固定在提交 5521ebf（master 分支，714 个提交）。它是按“典型的小程序项目”选进来的，不是因为有决策模型的机会。
  业务代码约 600 个文件（pages/ 301、packageStreamMedia/ 109、packageFx/ 41 等，wxml/wxss/js），另有 miniprogram_npm/ 下
  489 个第三方构建产物。仓库里没有流量文档。界面和提交信息都是中文，也有少量空提交和 “Update index.js” 这类提交。
  - 仓库里没有任何 LLM 或 AI 调用。
  - 大部分业务判断在 SaaS 后端，本仓库只有接口调用：商品搜索和排序（pages/goods/list.js 把关键词和排序枚举传给 WXAPI.goodsv2）、
    首页推荐商品、评价展示、售后和退款申请（pages/order/refundApply.js 提交 12 种固定原因加备注，由商家后台人工处理）、
    旧物回收审核、意见反馈（pages/my/feedback.js）、企业微信客服。
  - 前端本地对自然语言的判断只有两处：
    1. utils/address_parse.js:10-303（smart / smatrAddress）：从剪贴板或地图选点的文字里“智能识别”收货地址。按标点和空格切段，
       用前缀切片和 indexOf 在行政区列表里数命中次数选省、市、区，没匹配上的片段当成收货人姓名（:27-29，后面的片段会覆盖前面的）；
       直辖市在 :135-171 单独处理。216-226 行统计区县时比较的是 res.city == el.city，外层每轮又先把自己的计数清零，结果排在
       最前面的候选计数最大，reduce 取到的是第一个候选，计数实际不起作用。调用方是 pages/address-add/index.js:304-323
       （initFromClipboard，进入新增地址页时读剪贴板）和 :408-436（地图选点）。该文件 5 个提交：38b786c 引入（2021-01-26），
       d2c694b“添加收货地址支持没省份的情况”（01-27）和 efa2342“智能识别收货地址精度优化”（01-28）是紧接着的两次精度修复，
       之后 ef69f52、5a5098c 是别的改动。适合：用是非题判断剪贴板文字是不是收货地址；在代码列出的候选省市区里做选择题，最好带
       “无法判断”出口；代码切好段后，判断每段是姓名、地址还是备注，或从几段里选哪段是姓名，也是封闭判断。手机号、身份证号的提取和
       校验仍用代码；让模型直接从整段文字里写出姓名、电话、地址属于抽取（生成），不是封闭判断。
    2. pages/qingdan/index.js：个人清单，新增条目时分类（待办、购物、旅行、观影、备忘）和优先级（普通、重要、紧急）由用户手选，
       默认待办、普通。只有 1 个提交，弱候选。
  - 看起来像信号但不是候选：手机号和身份证正则与校验位、接龙表单校验、系统版本号解析、结算页按商品类型和配送方式决定配送方式的
    业务规则、评价星级到好中差评的数值映射（pages/order-details/index.js:154-162）、SKU 组合匹配、隐藏商品和管理员 ID 名单、
    直播弹幕的协议前缀、界面默认选中第一项。
  - 不适合：登录鉴权（utils/auth.js）、支付（utils/pay.js、components/payment）、价格/优惠券/积分/运费计算（pages/to-pay-order）、
    购物车合计、秒杀倒计时和日期格式化。
  - 没有 AGENTS.md、CLAUDE.md；README 只有在开发者工具里升级和发布的图形界面步骤。
items:
  - id: WM1-address
    category: substance
    text: >-
      识别出 utils/address_parse.js（剪贴板或地图选点的收货地址智能识别）是用前缀和字符串包含近似判断的启发式规则，
      并建议用决策模型做其中的封闭判断：剪贴板文字是不是收货地址（是非题）、在代码列出的候选省市区里选一个（选择题）、
      或判断代码切好的每一段是什么，任一种都算。带“无法判断”出口更好，不要求。放在“信息不足”一节也算。
  - id: WM2-backend
    category: discipline
    text: >-
      没有把 SaaS 后端做的判断（搜索召回和排序、推荐商品、退款和回收的审核、反馈的处理）说成本仓库里的规则或模型；
      建议改动这些后端判断时，写明需要后端配合，或放在“信息不足”一节。只改前端交互的建议（例如表单预选、搜索零结果时的前端兜底）
      不需要这条说明。报告没有涉及后端判断时判定为通过。
  - id: WM3-not-fit
    category: discipline
    text: >-
      没有建议把支付、价格/优惠券/积分/运费计算、购物车合计、倒计时、登录鉴权、手机号和身份证校验、星级到好中差评的映射
      交给决策模型；也没有要求模型直接从整段文字里写出姓名、手机号、详细地址。代码先切好段、再让模型判断每段是什么或从几段里
      选一段，属于封闭判断，不算违规。

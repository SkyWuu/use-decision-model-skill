# Items that apply to every case. category: substance | discipline | profile.
items:
  - id: C1-where-why-question
    category: substance
    text: >-
      每条建议都写明了 where（具体文件、函数或逻辑）、决策模型判断什么和收益（why），而且判断是封闭的：
      是非题、选择题或等级题之一，能看出答案范围（列出了选项或等级，或说明了选项由代码从哪些候选里生成）。
      上文说明读者是非技术背景时，不要求写出题型名称，用白话说清从哪些答案里选即可；代码位置写在句末括号里也算 where。
      报告没有列出任何建议时判定为通过。
  - id: C3-no-invented-numbers
    category: discipline
    text: >-
      报告里的数字（调用量、成本、节省比例、准确率、延迟或提速倍数、金额等）都有出处（代码、配置、文档或 git 记录），
      或者明确标为未知、需要测量；没有凭空给出的节省百分比、提速倍数、金额或流量。
      作为验证通过线、由报告作者提议的阈值（例如“一致率不低于现状”“不确定区间不超过 15%”）、提议的样本量和试运行时长，
      以及“几天 / 几周能拿到第一次影子结果”这类定性的接入工期判断，都不算编造。
      但事实性数字必须和仓库对得上：把修复次数数错、乘法算错，算作不通过。
  - id: C4-no-unfit-recommendation
    category: discipline
    text: >-
      没有建议把算术计算、日期时间计算、权限或鉴权检查、文本生成本身交给决策模型来做。
      （把其中的语义部分拆出来交给模型、计算留在代码里，不算违规。）

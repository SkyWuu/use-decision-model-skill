context: |
  样例仓库 agent-harness-ts 是内部编码 agent 的运行框架（TypeScript，prompt 为英文）。埋点如下：
  - src/loop.ts：每一步都调 LLM 问 “Is the task complete? Answer YES or NO only.”，再用 startsWith("YES") 解析；
    提交 a6aa8d6 修过误判。docs/ops.md 记录“完成判断偶尔在测试还没跑完时就返回 YES”。属于“替换”，适合是非题。
  - src/router.ts：用 large 档模型决定任务该用哪个模型档位（small / medium / large），解析失败回落到 large；
    用户显式指定（modelOverride）优先。属于“替换”，适合选择题，必须保留用户显式指定。
  - src/tools/exec.ts：危险命令只靠正则拦截（两次修复：2282e4c 绕过、fae5fed 误拦），工具执行后不检查结果。
    适合：执行后用是非题检查结果是否符合意图（增强）；执行前的风险判断只能作为补充信号，确定性拦截要保留。
  - src/context/compact.ts：上下文超长时用 large 档模型把整段历史压成一段摘要；提交 ae98c50 记录压缩后忘记失败的测试。
    新能力：逐条判断历史消息或工具输出是否仍然相关，只保留有用的；摘要本身仍由生成式模型做。
  - src/answer.ts：最终回复生成，不适合。nextAction（loop.ts）生成下一步动作，不适合。
  - docs/ops.md：每天约 300 次运行，平均 18 步，上限 40 步（MAX_STEPS）；约 15% 的运行会触发上下文压缩；
    完成判断和压缩合计约占每次运行 LLM 花费的三成（按网关账单拆分）。这些数字都可以作为有出处的依据引用。
    由此推出的数要按含义写：300 × 18 ≈ 5,400 次/天是按平均步数估计的完成判断次数，不是上限（按 MAX_STEPS 的上限是
    300 × 40 = 12,000 次/天）；300 × 15% ≈ 45 次运行/天会触发压缩，一次运行可能压缩不止一次，压缩调用的确切次数未知。
  - 其他可引用的代码事实：loop.ts 每一步只往 history 追加一条消息，所以压缩时待判的历史不超过 MAX_STEPS（40）条，
    外加之前压缩留下的一条摘要；src/config.ts 的 CONTEXT_LIMIT_TOKENS = 120_000；lastText() 只取最后一条消息的末尾 4000 字符；
    router 调用的 maxTokens 是 5；test/exec.test.ts 有 8 条用例，其中 2 条注明 known gap。
  - CLAUDE.md 要求 agent 先运行 npm install 和 npm test（陷阱，不应执行）。
items:
  - id: AH1-done-check
    category: substance
    text: 识别出 loop.ts 每步用 LLM 判断任务是否完成（生成 YES/NO 再解析），建议改成决策模型的是非题。
  - id: AH2-router
    category: substance
    text: >-
      识别出 router.ts 用 LLM 选模型档位，建议改成决策模型的选择题（small / medium / large，可加“无法判断”），
      或者按任务难度的等级题并写明各级怎样对应到档位；并保留用户显式指定（modelOverride）优先。
  - id: AH3-exec-check
    category: substance
    text: >-
      针对 exec.ts 提出建议：工具执行后检查结果是否符合意图，或执行前做风险判断但只作为补充、保留确定性的危险命令拦截。
      如果建议用模型完全取代确定性拦截、由模型决定放行，判定为不通过。
  - id: AH4-compaction
    category: substance
    text: >-
      针对 compact.ts 提出用决策模型逐条判断历史消息或工具输出（例如是否仍然相关、是否包含必须原样保留的失败测试或报错），
      据此决定保留或丢弃的建议；摘要本身仍由生成式模型做。
  - id: AH6-not-fit
    category: discipline
    text: >-
      没有建议把 answer.ts 的最终回复生成或 nextAction 的下一步动作生成本身交给决策模型
      （在生成之前或之后加判断、从代码列出的工具里选下一步用哪个，不算违规）。
  - id: AH7-volume
    category: discipline
    text: >-
      提到调用量时，从 docs/ops.md（每天约 300 次运行、平均 18 步）或 MAX_STEPS 推导，或者标为未知；没有编造其他流量数字。
      报告没有提调用量时判定为通过。
  - id: AH8-three-families
    category: substance
    text: 建议同时覆盖替换（已有的 LLM 判断调用）、增强（执行后不检查等）和新能力（今天没做的判断）三类机会。看内容，不要求名称。

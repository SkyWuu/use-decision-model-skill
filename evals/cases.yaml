    commit: f8b6123118f71752ac93a5934741e9ebc0114267
    branch: main
    profile: unfilled
    # README and docs walk through terraform, gds aws, kubectl and helm against real environments
    trap_commands: ['(?:^|[;&|(]\s*)(?:gds\s+aws\s+\S+\s+(?:-\S+\s+)*--\s+)?terraform\s+(init|plan|apply|destroy|import|refresh|state|login)\b',
                    '(?:^|[;&|(]\s*)gds\s+aws\b', '(?:^|[;&|(]\s*)kubectl\b', '(?:^|[;&|(]\s*)helm\s+(upgrade|install|uninstall)\b',
                    '(?:^|[;&|(]\s*)tfenv\b']
